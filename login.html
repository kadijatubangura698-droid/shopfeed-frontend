<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopFeed — Log In</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="auth-body">

  <div class="auth-card">
    <img src="assets/logo.png" class="auth-logo" alt="ShopFeed" />
    <h1 id="auth-title">Welcome to ShopFeed</h1>
    <p class="auth-subtitle" id="auth-subtitle">Log in to continue</p>

    <form id="auth-form">
      <label class="auth-label">Email</label>
      <input id="email-input" type="email" class="form-input" placeholder="you@example.com" required />

      <label class="auth-label">Password</label>
      <input id="password-input" type="password" class="form-input" placeholder="••••••••" minlength="6" required />

      <button type="submit" id="submit-btn" class="auth-btn">Log In</button>
      <p id="auth-error" class="auth-error"></p>
    </form>

    <p class="toggle-row">
      <span id="toggle-text">Don't have an account?</span>
      <button id="toggle-btn" class="auth-link-inline">Sign up</button>
    </p>

    <!-- First-time signup only: pick a role -->
    <div id="role-step" class="hidden">
      <label class="auth-label">How will you use ShopFeed?</label>
      <button class="role-btn" data-role="buyer">🛍️ I'm here to Buy</button>
      <button class="role-btn" data-role="business">🏪 I'm here to Sell</button>
    </div>

    <p id="status-msg" class="auth-status"></p>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
