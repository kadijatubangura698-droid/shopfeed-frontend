<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopFeed — Inbox</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="inbox.css" />
</head>
<body class="inbox-body">

  <!-- Not logged in -->
  <div id="logged-out-view" class="center-msg hidden">
    <p>Log in to see your messages.</p>
    <a href="login.html" class="auth-btn upload-cta-btn">Log In / Sign Up</a>
  </div>

  <div id="inbox-view" class="hidden">
    <div class="inbox-header">
      <h2>Inbox</h2>
    </div>

    <div id="rooms-list" class="rooms-list"></div>
    <p id="empty-msg" class="empty-msg hidden">No conversations yet. Message a seller from the feed to start one.</p>
  </div>

  <!-- Bottom navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 3l9 8h-2v9h-5v-6H10v6H5v-9H3l9-8z"/></svg>
      <p>Home</p>
    </a>
    <a href="discover.html" class="nav-item">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
      <p>Discover</p>
    </a>
    <a href="upload.html" class="nav-item center-btn">
      <img src="assets/logo.png" alt="Post" />
    </a>
    <a href="inbox.html" class="nav-item active">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12c0 4.4-4 8-9 8-1.1 0-2.2-.2-3.2-.5L3 21l1.6-4.8C3.6 14.9 3 13.5 3 12c0-4.4 4-8 9-8s9 3.6 9 8z"/></svg>
      <p>Inbox</p>
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      <p>Profile</p>
    </a>
  </nav>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="inbox.js"></script>
</body>
</html>
